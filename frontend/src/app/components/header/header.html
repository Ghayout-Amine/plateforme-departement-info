<header class="header">
  <h1 class="logo">PGDI</h1>
  <nav>
    <a routerLink="/">Accueil</a>
    <a routerLink="/filieres">Filières</a>
    <a routerLink="/contact">Contact</a>
    @if (auth.isLoggedIn()) {
      <a routerLink="/dashboard">Tableau de bord</a>
      <a routerLink="/teachers">Enseignants</a>
      <a routerLink="/students">Étudiants</a>
      <a routerLink="/salles">Salles</a>
      <a routerLink="/groupes">Groupes</a>
      <a href="#" (click)="$event.preventDefault(); auth.logout()">Déconnexion</a>
    } @else {
      <a routerLink="/login">Connexion</a>
    }
  </nav>
</header>
