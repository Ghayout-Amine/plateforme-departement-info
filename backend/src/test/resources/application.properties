# Test Configuration - H2 In-Memory Database (Idempotent for test execution)
spring.datasource.url=jdbc:h2:mem:pgditest;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.sql.init.mode=never

# JWT config for tests
app.jwt.secret=MaSuperCleSecreteDeTestPourLeProjetPGDI2026Secure!
app.jwt.expiration-ms=86400000
app.init-test-user=false

# SpringDoc OpenAPI paths
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
