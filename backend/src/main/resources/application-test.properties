# =============================================================================
#  Profil "test" (PGDI2026-18) : base dédiée + chargement du jeu de données
#  Lancement : mvn spring-boot:run -Dspring-boot.run.profiles=test
#  Surcharge uniquement ce qui diffère de application.properties.
# =============================================================================

# Base séparée pour ne pas polluer la base de développement
spring.datasource.url=jdbc:mysql://localhost:3306/pgdi_test_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true

# Hibernate crée/complète les tables AVANT l'exécution du script de données
spring.jpa.hibernate.ddl-auto=update
spring.jpa.defer-datasource-initialization=true
spring.jpa.show-sql=false

# Chargement du jeu de données (idempotent) à chaque démarrage
spring.sql.init.mode=always
spring.sql.init.data-locations=classpath:db/testdata/data-test.sql
spring.sql.init.encoding=UTF-8
