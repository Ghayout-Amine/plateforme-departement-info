spring.application.name=backend
server.port=8080

# Configuration MySQL locale
spring.datasource.url=jdbc:mysql://localhost:3306/pgdi_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}

# Configuration JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Spring Security logging
logging.level.org.springframework.security=INFO

# Cle secrete JWT (min 256 bits / 32 caracteres)
app.jwt.secret=${JWT_SECRET:MaSuperCleSecreteDeTestPourLeProjetPGDI2026Secure!}

# Activation de l utilisateur de test
app.init-test-user=true


# SpringDoc OpenAPI / Swagger UI
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.operationsSorter=method
# PGDI2026-72 - Upload photos enseignants
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# PGDI2026-86 - Offres de stage externes (Jooble / JSearch)
# Cles gratuites a mettre dans des variables d'environnement, jamais dans Git.
# Jooble : cle par e-mail sur https://jooble.org/api/about (une cle = le site Jooble d'un pays, ex. Maroc)
# JSearch (RapidAPI) : facultatif
app.offres-externes.jooble.api-key=${JOOBLE_API_KEY:}
# URL du site Jooble qui a fourni la cle (Maroc par defaut ; France : https://fr.jooble.org/api/)
app.offres-externes.jooble.url=${JOOBLE_API_URL:https://ma.jooble.org/api/}
app.offres-externes.jsearch.api-key=${JSEARCH_API_KEY:}
app.offres-externes.cache-minutes=30
app.offres-externes.timeout-seconds=8

# PGDI2026-88 : veille technologique informatique & scientifique (GET /api/actualites/veille-externe)
# API publique Dev.to (sans cle) ; tag cible informatique/science
app.veille.devto.enabled=true
app.veille.devto.url=https://dev.to/api/articles
app.veille.devto.tag=computerscience
# Flux RSS / Atom : "Nom|URL", separes par ";"
app.veille.rss-feeds=arXiv Informatique|https://export.arxiv.org/api/query?search_query=cat:cs.AI+OR+cat:cs.SE+OR+cat:cs.CR&sortBy=submittedDate&sortOrder=descending&max_results=10;The Hacker News|https://feeds.feedburner.com/TheHackersNews
app.veille.cache-minutes=30
app.veille.timeout-seconds=15
