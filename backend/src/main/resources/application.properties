spring.application.name=backend
server.port=8080

# Configuration MySQL locale
spring.datasource.url=jdbc:mysql://localhost:3306/pgdi_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}

# Configuration JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Spring Security logging
logging.level.org.springframework.security=INFO

# Cle secrete JWT (min 256 bits / 32 caracteres)
app.jwt.secret=${JWT_SECRET:MaSuperCleSecreteDeTestPourLeProjetPGDI2026Secure!}

# Activation de l utilisateur de test
app.init-test-user=truew