
services:
  mysql:
    image: mysql:8.0
    container_name: pgdi-mysql
    restart: always
    environment:
      MYSQL_DATABASE: pgdi_db
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      pgdi-network:
        aliases:
          - mysql
          - pgdi-mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pgdi-backend
    restart: on-failure
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://pgdi-mysql:3306/pgdi_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      TEACHER_PHOTOS_DIR: /app/data/photos
      CONVENTIONS_DIR: /app/data/conventions
      JUSTIFICATIFS_DIR: /app/data/justificatifs
    volumes:
      - photos-data:/app/data/photos
      - conventions-data:/app/data/conventions
      - justificatifs-data:/app/data/justificatifs
    ports:
      - "8080:8080"
    networks:
      pgdi-network:
        aliases:
          - backend
          - pgdi-backend

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: pgdi-frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "80:80"
    networks:
      pgdi-network:
        aliases:
          - frontend
          - pgdi-frontend

networks:
  pgdi-network:
    driver: bridge

volumes:
  mysql-data:
  photos-data:
  conventions-data:
  justificatifs-data:
